services:
  painel-estudos:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro
      - ./imagens:/usr/share/nginx/imagens:ro
    depends_on:
      - css-watch
    restart: unless-stopped

  css-watch:
    build:
      context: .
      target: build
    command:
      - /bin/sh
      - -c
      - |
        npm run build:css
        previous="$$(find /app/src -type f ! -name output.css -exec sha256sum {} + | sha256sum)"
        while sleep 1; do
          current="$$(find /app/src -type f ! -name output.css -exec sha256sum {} + | sha256sum)"
          if [ "$$current" != "$$previous" ]; then
            npm run build:css || exit 1
            previous="$$current"
          fi
        done
    volumes:
      - ./src:/app/src
    restart: unless-stopped
